name: bonsai_flutter_logseq_journal_host
description: Mechanical Flutter host for the OCaml-owned logseq_journal application.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      # bonsai-flutter:begin native-hook
      native_artifact_root: ../_build/bonsai-flutter/artifacts/
      macos_deployment_target: '26.0'
      ios_deployment_target: '15.0'
      require_ocaml_backend: true
      link_system_sqlite3: true
      # bonsai-flutter:end native-hook

dependencies:
  material_ui: 1.1.1
  amplify_auth_cognito: 2.15.0
  amplify_authenticator: 2.7.0
  amplify_flutter: 2.15.0
  # bonsai-flutter:begin packages
  bonsai_flutter:
    path: ../.bonsai-flutter/flutter-packages/bonsai_flutter
  # bonsai-flutter:end packages
  flutter:
    sdk: flutter
  flutter_slidable: 4.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
