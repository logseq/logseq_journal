name: logseq_journal_host
description: Mechanical Flutter host for the OCaml-owned logseq_journal application.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    journal_lui_native:
      # journal-lui:begin native-hook
      native_artifact_root: ../_build/lui/artifacts/
      macos_deployment_target: '26.0'
      ios_deployment_target: '15.0'
      require_ocaml_backend: true
      link_system_sqlite3: true
      # journal-lui:end native-hook

dependencies:
  amplify_auth_cognito: 2.15.0
  amplify_authenticator: 2.7.0
  amplify_flutter: 2.15.0
  file_picker: 12.3.0
  url_launcher: 6.3.2
  shared_preferences: 2.5.5
  flutter:
    sdk: flutter
  flutter_slidable: 4.0.3
  journal_lui_native:
    path: packages/journal_lui_native
  # journal-lui:begin packages
  lui_flutter_backend:
    git:
      url: https://github.com/logseq/lui.git
      ref: 5958c0cd2c0309d79f1840549c6abd189338b0c8
      path: platform/flutter
  # journal-lui:end packages

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
