name: CI cache compatibility experiment
on:
  push:
    branches: [codex/ci-cache-compatibility-20261016]
permissions:
  contents: read
jobs:
  seed:
    uses: ./.github/workflows/ci.yml
    with:
      sqlite-profile: '3.50.4'
  compatible:
    needs: seed
    uses: ./.github/workflows/ci.yml
    with:
      sqlite-profile: '3.49.2'
