name: Journal CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # The production transport explicitly requires Apple DNS-SD.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
      - name: Resolve declared dependency sources
        run: python3 tool/prepare_ci_dependencies.py
      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: journal-opam-v1-${{ runner.os }}-${{ hashFiles('*.opam*', '.ci-reports/dependencies.json') }}
      - name: Pin resolved checkouts after cache restoration
        run: python3 tool/prepare_ci_dependencies.py --pin
      - name: Install locked dependencies
        run: opam install . --deps-only --with-test --locked --ignore-pin-depends --yes
      - name: Record installed package versions
        if: always()
        run: opam list --installed --columns=name,installed-version --short --color=never > .ci-reports/packages.txt
      - name: Build all targets and native embed
        run: |
          # OCaml's partial linker does not use the C compiler's multiarch paths.
          # Expose archives only so the complete object cannot select a shared library.
          if [ "$(uname -s)" = Linux ]; then
            static_directory="$PWD/.ci-deps/system-static-libs"
            mkdir -p "$static_directory"
            for library in rt sqlite3; do
              archive="$(cc -print-file-name="lib${library}.a")"
              test -f "$archive"
              ln -s "$archive" "$static_directory/lib${library}.a"
            done
            export OCAMLPARAM="_,cclib=-L$static_directory"
          fi
          opam exec -- dune build @all app/native_embed.exe.o
      - name: Run full regression suite
        run: opam exec -- dune runtest --force
      - name: Upload resolved dependencies and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-ci-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .ci-reports/
            _build/default/**/_build/_tests/
            _build/_tests/
